<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<meta name="description" content="Free, quick games you can play in your browser on your phone or computer.">
<title>Duryodhan Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root {
    --bg: #14112b; --bg2: #1e1a3d; --card: #24204a; --text: #f4f2ff; --muted: #a8a3cc; --accent: #ffca28; --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(1200px 600px at 50% -200px, #2f2870 0%, var(--bg) 60%) fixed, var(--bg);
         color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  header { padding: calc(28px + env(safe-area-inset-top)) 0 8px; display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 30px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
  .hero { padding: 32px 0 28px; }
  .hero h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.05; margin: 0 0 12px; letter-spacing: -.5px; }
  .hero h1 span { color: var(--accent); }
  .hero p { color: var(--muted); font-size: 17px; margin: 0; max-width: 520px; line-height: 1.5; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 16px; }
  .bar h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 0; font-weight: 700; }
  .count { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; padding-bottom: 48px; }
  .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
          text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.35); outline: none; }
  .card:active { transform: scale(.98); }
  .art { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; font-size: 72px; position: relative; }
  .art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 55%); }
  .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .body h3 { margin: 0; font-size: 20px; }
  .body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 20px; background: rgba(255,255,255,.08); color: var(--muted); }
  .play { margin-top: 6px; align-self: flex-start; background: var(--accent); color: #1a1a1a; font-weight: 800; padding: 9px 22px; border-radius: 30px; font-size: 15px; }
  .soon { border-style: dashed; border-color: rgba(255,255,255,.18); background: transparent; align-items: center; justify-content: center;
          text-align: center; padding: 32px 16px; color: var(--muted); min-height: 220px; }
  .soon .big { font-size: 40px; margin-bottom: 6px; }
  footer { border-top: 1px solid var(--line); padding: 20px 0 calc(28px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header><span class="logo">🎮</span><span class="brand">Duryodhan Arcade</span></header>
    <section class="hero">
      <h1>Quick games.<br><span>Tap and play.</span></h1>
      <p>Free games that run right in your browser, on your phone or computer. Nothing to download.</p>
    </section>
    <div class="bar"><h2>Games</h2><span class="count" id="count"></span></div>
    <main class="grid" id="grid"></main>
  </div>
  <footer>Made for fun · More games coming soon</footer>

<script src="games.js"></script>
<script>
  const grid = document.getElementById('grid');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  for (const g of window.GAMES) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = `/games/${g.slug}/`;
    a.innerHTML = `
      <div class="art" style="background: linear-gradient(135deg, ${g.color[0]}, ${g.color[1]})">${esc(g.emoji)}</div>
      <div class="body">
        <h3>${esc(g.title)}</h3>
        <div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <p>${esc(g.description)}</p>
        <span class="play">Play ▶</span>
      </div>`;
    grid.appendChild(a);
  }
  const soon = document.createElement('div');
  soon.className = 'card soon';
  soon.innerHTML = '<div><div class="big">🕹️</div><b>More games coming soon</b></div>';
  grid.appendChild(soon);
  const n = window.GAMES.length;
  document.getElementById('count').textContent = `${n} game${n === 1 ? '' : 's'}`;
</script>
</body>
</html>
