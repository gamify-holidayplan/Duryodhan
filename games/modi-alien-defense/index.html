<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modi Alien Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: radial-gradient(ellipse at center, #1c2340 0%, #090b16 100%);
  color: #e8ecff;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}

#wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#game {
  display: block;
  width: min(96vw, calc((100vh - 60px) * 16 / 9));
  aspect-ratio: 16 / 9;
  border: 4px solid #1b1b2a;
  border-radius: 10px;
  box-shadow: 0 0 0 3px #ffcc33, 0 18px 50px rgba(0, 0, 0, 0.7);
  background: #000;
  cursor: crosshair;
  outline: none;
}

#help {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  font-size: 12px;
  opacity: 0.75;
  padding: 0 10px;
}

#help b { color: #ffcc33; font-weight: 700; }


  #home {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    backdrop-filter: blur(8px);
    transition: background 0.15s ease, transform 0.15s ease;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #home:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }
  </style>
</head>
<body>
  <a id="home" href="/">← All games</a>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="help">
      <span><b>Move</b> A/D or ←/→</span>
      <span><b>Jump</b> W/↑/Space</span>
      <span><b>Drop down</b> S/↓</span>
      <span><b>Shoot</b> Mouse (aim) · J forward · K up</span>
      <span><b>Weapons</b> Q/E · 1-4 · wheel</span>
      <span><b>Pause</b> P/Esc</span>
      <span><b>Mute</b> M</span>
    </div>
  </div>

  <script>
'use strict';
/* ===========================================================
   Shared constants, math helpers, cartoon drawing helpers, input
   =========================================================== */

const W = 960, H = 540;
const GROUND_Y = 460;
const GRAVITY = 0.6;
const OUTLINE = '#1b1b2a';
const TAU = Math.PI * 2;
const FONT = '"Bangers", "Impact", "Arial Black", sans-serif';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

function weightedPick(weights, rng = Math.random) {
  const entries = Object.entries(weights).filter(([, w]) => w > 0);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = rng() * total;
  for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
  return entries[entries.length - 1][0];
}

/* ---------- Cartoon drawing helpers (thick outlines = flash-game look) ---------- */
function pathRoundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillStroke(ctx, fill, lw = 3) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = OUTLINE; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function drawCircle(ctx, x, y, r, fill, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); fillStroke(ctx, fill, lw);
}
function drawEllipse(ctx, x, y, rx, ry, fill, lw = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); fillStroke(ctx, fill, lw);
}
function drawRRect(ctx, x, y, w, h, r, fill, lw = 3) {
  pathRoundRect(ctx, x, y, w, h, r); fillStroke(ctx, fill, lw);
}
function drawPoly(ctx, pts, fill, lw = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); fillStroke(ctx, fill, lw);
}
function drawLine(ctx, x1, y1, x2, y2, color = OUTLINE, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function drawStar(ctx, x, y, r, fill, lw = 2) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  drawPoly(ctx, pts, fill, lw);
}
/* Indian Rupee symbol (₹) */
function drawRupeeSymbol(ctx, x, y, s, color = '#b37700', lw = 1.6) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Top horizontal bar
  drawLine(ctx, x - s * 0.45, y - s * 0.52, x + s * 0.45, y - s * 0.52, color, lw);
  // Second horizontal bar
  drawLine(ctx, x - s * 0.45, y - s * 0.20, x + s * 0.35, y - s * 0.20, color, lw);
  // Vertical stem & upper rounded curve
  ctx.beginPath();
  ctx.moveTo(x - s * 0.16, y - s * 0.52);
  ctx.lineTo(x - s * 0.16, y - s * 0.04);
  ctx.bezierCurveTo(x + s * 0.42, y - s * 0.04, x + s * 0.42, y - s * 0.52, x - s * 0.16, y - s * 0.52);
  ctx.stroke();
  // Downward diagonal leg
  ctx.beginPath();
  ctx.moveTo(x - s * 0.06, y - s * 0.04);
  ctx.lineTo(x + s * 0.44, y + s * 0.54);
  ctx.stroke();
  ctx.restore();
}
/* Indian National Flag (Tiranga) */
function drawIndianFlag(ctx, x, y, w, h, t = 0) {
  const cols = 12, cw = w / cols, sh = h / 3;
  for (let i = 0; i < cols; i++) {
    const off = Math.sin(t * 0.1 + i * 0.6) * 2 * (i / cols);
    ctx.fillStyle = '#ff9933'; ctx.fillRect(x + i * cw, y + off, cw + 0.6, sh + 0.5);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + i * cw, y + off + sh, cw + 0.6, sh + 0.5);
    ctx.fillStyle = '#138808'; ctx.fillRect(x + i * cw, y + off + sh * 2, cw + 0.6, sh + 0.5);
  }
  // Ashoka Chakra in center
  const cx = x + w / 2, cy = y + h / 2 + Math.sin(t * 0.1 + (cols / 2) * 0.6) * 1;
  const cr = sh * 0.42;
  ctx.strokeStyle = '#000080'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, cr, 0, TAU); ctx.stroke();
  for (let s = 0; s < 12; s++) {
    const a = s * Math.PI / 6;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * cr, cy + Math.sin(a) * cr);
    ctx.lineTo(cx - Math.cos(a) * cr, cy - Math.sin(a) * cr);
    ctx.stroke();
  }
  ctx.fillStyle = '#000080'; ctx.beginPath(); ctx.arc(cx, cy, 1.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
}
/* Union of circles with one shared outline (clouds, bushes, brains...) */
function drawBlob(ctx, circles, fill, lw = 3) {
  ctx.fillStyle = OUTLINE;
  for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r + lw / 2 + 0.5, 0, TAU); ctx.fill(); }
  ctx.fillStyle = fill;
  for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r - lw / 2 + 0.5, 0, TAU); ctx.fill(); }
}
function cartoonText(ctx, text, x, y, size, fill = '#fff', align = 'center', strokeW) {
  ctx.save();
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = strokeW ?? Math.max(3, size / 6);
  ctx.strokeStyle = OUTLINE; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
  ctx.restore();
}
function plainText(ctx, text, x, y, size, fill = '#fff', align = 'left', weight = 'bold') {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

/* ---------- Input ---------- */
class Input {
  constructor(canvas, onFirstInteract) {
    this.canvas = canvas;
    this.keys = {}; this.pressed = {};
    this.mouse = { x: W / 2, y: H / 2, down: false, clicked: false };
    this.wheel = 0;
    this.lastMouseMove = 0;
    const first = () => onFirstInteract && onFirstInteract();
    const block = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];

    window.addEventListener('keydown', e => {
      first();
      if (block.includes(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.mouse.down = false; });

    const toCanvas = e => {
      const r = canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - r.left) * (W / r.width);
      this.mouse.y = (e.clientY - r.top) * (H / r.height);
    };
    canvas.addEventListener('mousemove', e => { toCanvas(e); this.lastMouseMove = performance.now(); });
    canvas.addEventListener('mousedown', e => {
      first(); toCanvas(e);
      if (e.button === 0) { this.mouse.down = true; this.mouse.clicked = true; }
      e.preventDefault();
    });
    window.addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  }
  down(...codes) { return codes.some(c => this.keys[c]); }
  hit(...codes) { return codes.some(c => this.pressed[c]); }
  anyHit() { return Object.keys(this.pressed).length > 0 || this.mouse.clicked; }
  endFrame() { this.pressed = {}; this.mouse.clicked = false; this.wheel = 0; }
}



'use strict';
/* ===========================================================
   AudioManager - all music & SFX synthesized with Web Audio
   =========================================================== */

const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* Each song: chord progression (root midi, minor?) one bar each, and a
   32-step lead pattern indexing into chord tones (-1 = rest). */
const SONGS = {
  title: { bpm: 112, wave: 'triangle', chords: [[60, 0], [57, 1], [53, 0], [55, 0]],
    lead: [0, -1, 2, -1, 3, -1, 2, -1, 1, -1, 2, -1, 0, -1, -1, -1, 0, -1, 2, -1, 4, -1, 3, -1, 2, -1, 1, -1, 2, -1, -1, -1] },
  dc: { bpm: 140, wave: 'square', chords: [[60, 0], [55, 0], [57, 1], [53, 0]],
    lead: [0, 0, 2, -1, 3, -1, 2, 3, 4, -1, 3, -1, 2, -1, 0, -1, 3, 3, 4, -1, 5, -1, 4, 3, 2, -1, 3, -1, 1, -1, -1, -1] },
  ny: { bpm: 150, wave: 'square', chords: [[57, 1], [53, 0], [60, 0], [55, 0]],
    lead: [0, -1, 0, 2, -1, 3, -1, 2, 0, -1, 0, 2, -1, 4, 3, -1, 0, -1, 0, 2, -1, 3, -1, 5, 4, -1, 3, -1, 2, -1, 1, -1] },
  london: { bpm: 132, wave: 'sawtooth', chords: [[62, 1], [58, 0], [60, 0], [57, 0]],
    lead: [3, -1, 2, -1, 0, -1, 2, -1, 3, -1, 4, -1, 3, -1, -1, -1, 2, -1, 1, -1, 0, -1, 1, -1, 2, -1, 3, -1, 2, -1, -1, -1] },
  boss: { bpm: 168, wave: 'sawtooth', octave: 12, chords: [[52, 1], [48, 0], [50, 0], [47, 0]],
    lead: [0, 3, 2, 3, 0, 3, 2, 3, 0, 4, 3, 4, 0, 4, 3, 4, 0, 3, 2, 3, 0, 3, 2, 3, 5, 4, 3, 2, 1, 2, 3, 4] },
  victory: { bpm: 120, wave: 'triangle', chords: [[60, 0], [65, 0], [67, 0], [60, 0]],
    lead: [0, -1, 1, -1, 2, -1, 3, -1, 2, -1, 3, -1, 4, -1, -1, -1, 3, -1, 4, -1, 5, -1, 4, -1, 3, -1, 2, -1, 0, -1, -1, -1] },
};

class AudioManager {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.song = null; this.songName = null;
    this.step = 0; this.nextTime = 0;
    this.lastPlay = {};
  }

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.6;
    this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.75; this.sfx.connect(this.master);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.2; this.music.connect(this.master);

    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    if (this.song) this.nextTime = this.ctx.currentTime + 0.05;
    this.timer = setInterval(() => this.schedule(), 25);
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.6;
  }

  /* ---------- primitives ---------- */
  osc(f, at, dur, type = 'square', vol = 0.2, slide = null, dest = this.sfx) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, at);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(dest);
    o.start(at); o.stop(at + dur + 0.05);
  }
  tone(f, dur, type, vol, slide, delay = 0) {
    this.osc(f, this.ctx.currentTime + delay, dur, type, vol, slide);
  }
  noiseAt(at, dur, vol = 0.3, freq = 1000, dest = this.sfx, ftype = 'lowpass') {
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(at, Math.random() * 0.5); src.stop(at + dur + 0.05);
  }
  noise(dur, vol, freq, delay = 0, ftype) { this.noiseAt(this.ctx.currentTime + delay, dur, vol, freq, this.sfx, ftype); }

  alien(dur = 0.45, vol = 0.1, base = rand(450, 900)) {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator();
    const lg = this.ctx.createGain(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * rand(0.5, 1.8), t + dur);
    lfo.frequency.value = rand(14, 30); lg.gain.value = base * 0.3;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  }

  /* ---------- sound effects ---------- */
  play(name) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    if (this.lastPlay[name] && now - this.lastPlay[name] < 0.04) return;
    this.lastPlay[name] = now;
    const T = (f, d, type, v, slide, delay) => this.tone(f, d, type, v, slide, delay);
    switch (name) {
      case 'shoot': T(1300, 0.12, 'square', 0.07, 300); T(650, 0.1, 'sawtooth', 0.04, 200); break;
      case 'triple': T(1600, 0.1, 'square', 0.06, 500); T(1100, 0.1, 'square', 0.05, 350, 0.02); break;
      case 'cannon': T(420, 0.35, 'sawtooth', 0.14, 60); this.noise(0.25, 0.14, 1500); break;
      case 'plasma': T(180, 0.5, 'sine', 0.25, 900); T(90, 0.45, 'square', 0.06, 400); break;
      case 'enemyShoot': T(480, 0.15, 'triangle', 0.08, 1400); break;
      case 'hit': T(320, 0.06, 'square', 0.06, 150); break;
      case 'explode': this.noise(0.45, 0.35, 900); T(140, 0.35, 'sine', 0.3, 35); break;
      case 'bigexplode': this.noise(1.3, 0.5, 600); T(90, 1.1, 'sine', 0.45, 25); break;
      case 'coin': T(988, 0.08, 'square', 0.08); T(1319, 0.25, 'square', 0.08, null, 0.07); break;
      case 'energy': [523, 659, 784, 1047, 1319].forEach((f, i) => T(f, 0.14, 'triangle', 0.16, null, i * 0.055)); break;
      case 'health': [440, 554, 659, 880].forEach((f, i) => T(f, 0.16, 'sine', 0.18, null, i * 0.07)); break;
      case 'weapon': [392, 523, 659, 784, 1047].forEach((f, i) => T(f, 0.16, 'square', 0.08, null, i * 0.07)); break;
      case 'select': T(700, 0.06, 'square', 0.06); T(1050, 0.08, 'square', 0.06, null, 0.05); break;
      case 'jump': T(280, 0.16, 'square', 0.05, 620); break;
      case 'hurt': T(220, 0.3, 'sawtooth', 0.15, 70); break;
      case 'empty': T(120, 0.05, 'square', 0.08); break;
      case 'alien': this.alien(); break;
      case 'boss': T(70, 1.4, 'sawtooth', 0.22, 35); this.alien(1.0, 0.18, 220); this.noise(1.2, 0.15, 300); break;
      case 'stomp': this.noise(0.45, 0.45, 300); T(65, 0.45, 'sine', 0.45, 30); break;
      case 'beam': T(140, 1.1, 'sawtooth', 0.1, 320); T(280, 1.1, 'square', 0.04, 640); break;
      case 'warn': T(880, 0.12, 'square', 0.07); T(880, 0.12, 'square', 0.07, null, 0.2); break;
      case 'flag': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => T(f, i === 5 ? 0.6 : 0.15, 'square', 0.09, null, i * 0.12)); break;
      case 'gameover': [392, 349, 311, 262].forEach((f, i) => T(f, 0.35, 'triangle', 0.18, null, i * 0.28)); break;
      case 'start': [262, 392, 523, 784].forEach((f, i) => T(f, 0.18, 'square', 0.08, null, i * 0.08)); break;
    }
  }

  /* ---------- music sequencer ---------- */
  playSong(name) {
    if (this.songName === name) return;
    this.songName = name; this.song = SONGS[name] || null; this.step = 0;
    if (this.ctx) this.nextTime = this.ctx.currentTime + 0.08;
  }
  stopSong() { this.song = null; this.songName = null; }

  schedule() {
    if (!this.ctx || !this.song) return;
    const spb = 60 / this.song.bpm / 4;
    if (this.nextTime < this.ctx.currentTime) this.nextTime = this.ctx.currentTime + 0.05;
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      this.playStep(this.step, this.nextTime, spb);
      this.nextTime += spb; this.step++;
    }
  }

  playStep(s, t, spb) {
    const S = this.song, M = this.music;
    const bar = Math.floor(s / 16) % S.chords.length, pos = s % 16;
    const [root, minor] = S.chords[bar];
    const third = minor ? 3 : 4;
    const tones = [0, third, 7, 12, 12 + third, 19];
    // bass (8th notes with octave bounce)
    if (pos % 2 === 0) this.osc(midiFreq(root - 24 + (pos % 4 === 2 ? 12 : 0)), t, spb * 1.8, 'triangle', 0.55, null, M);
    // chord pad on bar start
    if (pos === 0) [0, third, 7].forEach(iv => this.osc(midiFreq(root + iv - 12), t, spb * 14, 'sine', 0.07, null, M));
    // lead
    const li = S.lead[s % S.lead.length];
    if (li >= 0) this.osc(midiFreq(root + (S.octave || 0) + tones[li]), t, spb * 1.6, S.wave, 0.13, null, M);
    // drums
    if (pos % 4 === 0) this.osc(150, t, 0.18, 'sine', 0.6, 40, M);
    if (pos === 4 || pos === 12) this.noiseAt(t, 0.12, 0.25, 2500, M, 'bandpass');
    if (pos % 2 === 1 || S.octave) this.noiseAt(t, 0.03, 0.12, 7000, M, 'highpass');
  }
}



'use strict';
/* ===========================================================
   Core entities: base Entity, physics, Platform, Hazard,
   Player (Modi), Projectile, Item, Flag, Particles
   =========================================================== */

class Entity {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0; this.dead = false;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
}

/* Axis-separated movement against solid and one-way platforms */
function physicsMove(e, platforms, ignoreOneWay = false) {
  e.onGround = false; e.standingOn = null; e.hitWall = false;
  e.x += e.vx;
  for (const p of platforms) {
    if (p.oneWay || !overlap(e, p)) continue;
    if (e.vx > 0) e.x = p.x - e.w;
    else if (e.vx < 0) e.x = p.x + p.w;
    else e.x = e.cx < p.x + p.w / 2 ? p.x - e.w : p.x + p.w;
    e.hitWall = true;
  }
  const prevBottom = e.y + e.h;
  e.y += e.vy;
  for (const p of platforms) {
    if (!overlap(e, p)) continue;
    if (p.oneWay) {
      if (ignoreOneWay || e.vy < 0) continue;
      if (prevBottom <= p.prevY + 4) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; e.standingOn = p; }
    } else if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; e.standingOn = p; }
    else if (e.vy < 0) { e.y = p.y + p.h; e.vy = 0; }
  }
}

function groundBelow(x, feetY, platforms) {
  for (const p of platforms) {
    if (x >= p.x && x <= p.x + p.w && p.y >= feetY - 4 && p.y <= feetY + 30) return true;
  }
  return false;
}

/* ---------------- Platforms ---------------- */
class Platform {
  constructor(x, y, w, h, kind, opts = {}) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.kind = kind; // ground | block | ledge | moving
    this.oneWay = kind === 'ledge' || kind === 'moving';
    this.dx = 0; this.dy = 0; this.prevY = y;
    this.ox = x; this.oy = y;
    this.rangeX = opts.rangeX || 0; this.rangeY = opts.rangeY || 0;
    this.speed = opts.speed || 0.02; this.t = opts.phase || 0;
  }
  update() {
    this.prevY = this.y;
    if (this.kind !== 'moving') return;
    this.t += this.speed;
    const nx = this.ox + Math.sin(this.t) * this.rangeX;
    const ny = this.oy + Math.sin(this.t) * this.rangeY;
    this.dx = nx - this.x; this.dy = ny - this.y;
    this.x = nx; this.y = ny;
  }
  draw(ctx, th, camX) {
    if (this.x > camX + W + 20 || this.x + this.w < camX - 20) return;
    const { x, y, w, h } = this;
    if (this.kind === 'ground') {
      const x0 = Math.max(x, camX - 20), x1 = Math.min(x + w, camX + W + 20);
      ctx.fillStyle = th.groundFill; ctx.fillRect(x, y, w, H - y + 10);
      // texture dots / bricks
      ctx.fillStyle = th.groundDot;
      const start = Math.floor(x0 / 40) * 40;
      for (let gx = start; gx < x1; gx += 40) {
        if (gx < x || gx > x + w - 10) continue;
        const k = (gx * 7919) % 97;
        if (th.bricks) {
          for (let row = 0; row < 4; row++) {
            const ox = row % 2 ? 20 : 0;
            ctx.fillRect(gx + ox, y + 26 + row * 16, 36, 2);
            ctx.fillRect(gx + ox, y + 26 + row * 16, 2, 14);
          }
        } else {
          ctx.beginPath(); ctx.ellipse(gx + (k % 30), y + 35 + (k % 40), 5, 3, 0, 0, TAU); ctx.fill();
        }
      }
      // top strip
      ctx.fillStyle = th.groundTop; ctx.fillRect(x, y, w, 16);
      ctx.fillStyle = th.groundTop2; ctx.fillRect(x, y + 12, w, 5);
      if (th.grass) {
        ctx.fillStyle = th.groundTop;
        for (let gx = Math.floor(x0 / 18) * 18; gx < x1; gx += 18) {
          if (gx < x || gx > x + w - 18) continue;
          ctx.beginPath(); ctx.arc(gx + 9, y + 16, 9, 0, Math.PI); ctx.fill();
        }
      } else {
        ctx.fillStyle = th.groundTop2;
        for (let gx = Math.floor(x0 / 60) * 60; gx < x1; gx += 60) if (gx > x && gx < x + w) ctx.fillRect(gx, y, 3, 14);
      }
      ctx.lineWidth = 4; ctx.strokeStyle = OUTLINE;
      ctx.beginPath(); ctx.moveTo(x, H + 10); ctx.lineTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, H + 10); ctx.stroke();
    } else if (this.kind === 'block') {
      drawRRect(ctx, x, y, w, h, 4, th.block, 4);
      ctx.strokeStyle = th.blockDark; ctx.lineWidth = 4;
      ctx.strokeRect(x + 7, y + 7, w - 14, h - 14);
      ctx.beginPath(); ctx.moveTo(x + 9, y + 9); ctx.lineTo(x + w - 9, y + h - 9);
      ctx.moveTo(x + w - 9, y + 9); ctx.lineTo(x + 9, y + h - 9); ctx.stroke();
      drawRRect(ctx, x, y, w, h, 4, null, 4);
    } else if (this.kind === 'ledge') {
      drawLine(ctx, x + 14, y + h, x + 24, y + h + 26, OUTLINE, 5);
      drawLine(ctx, x + w - 14, y + h, x + w - 24, y + h + 26, OUTLINE, 5);
      drawRRect(ctx, x, y, w, h, 5, th.ledge, 3);
      ctx.fillStyle = th.ledgeDark; ctx.fillRect(x + 4, y + h - 6, w - 8, 3);
      ctx.fillStyle = OUTLINE;
      for (let i = x + 12; i < x + w - 6; i += 24) { ctx.beginPath(); ctx.arc(i, y + 6, 2, 0, TAU); ctx.fill(); }
    } else if (this.kind === 'moving') {
      const g = ctx.createLinearGradient(0, y + h, 0, y + h + 30);
      g.addColorStop(0, 'rgba(90,255,220,0.6)'); g.addColorStop(1, 'rgba(90,255,220,0)');
      ctx.fillStyle = g; ctx.fillRect(x + 18, y + h, w - 36, 30);
      drawRRect(ctx, x, y, w, h, 8, '#9aa6bf', 3);
      ctx.fillStyle = '#5affdc'; ctx.fillRect(x + 10, y + h - 5, w - 20, 3);
      for (let i = 0; i < 3; i++) drawCircle(ctx, x + w / 2 - 24 + i * 24, y + 7, 3, (Math.floor(this.t * 6) % 3 === i) ? '#ffef5a' : '#57607a', 1.5);
    }
  }
}

/* Alien crystal spikes */
class Hazard extends Entity {
  constructor(x, w) { super(x, GROUND_Y - 22, w, 22); this.t = Math.random() * 10; }
  draw(ctx, th) {
    this.t += 0.05;
    const n = Math.max(2, Math.round(this.w / 20)), sw = this.w / n;
    ctx.save();
    ctx.shadowColor = th.spikes; ctx.shadowBlur = 8 + Math.sin(this.t) * 4;
    for (let i = 0; i < n; i++) {
      const bx = this.x + i * sw, hh = 22 + (i % 2) * 6;
      drawPoly(ctx, [bx, GROUND_Y, bx + sw / 2, GROUND_Y - hh, bx + sw, GROUND_Y], th.spikes, 2.5);
      ctx.shadowBlur = 0;
      drawPoly(ctx, [bx + sw * 0.35, GROUND_Y - 4, bx + sw / 2, GROUND_Y - hh + 6, bx + sw * 0.5, GROUND_Y - 4], 'rgba(255,255,255,0.6)', 0);
    }
    ctx.restore();
  }
}

const PLAYER_SCALE = 0.84;

class Player extends Entity {
  constructor(x, y) {
    super(x, y, 28, 60);
    this.facing = 1;
    this.maxHp = 5; this.hp = 5;
    this.maxEnergy = 100; this.energy = 100;
    this.weapons = ['laser']; this.weaponIdx = 0;
    this.cooldown = 0; this.invuln = 0; this.dropTimer = 0;
    this.coyote = 0; this.jumpBuffer = 0;
    this.runPhase = 0; this.aimAngle = 0; this.aimTimer = 0; this.recoil = 0;
    this.speech = null; this.hidden = false; this.blinkT = 120;
    this.lastSafe = { x, y };
    this.frozen = false;
  }
  get weapon() { return WEAPONS[this.weapons[this.weaponIdx]]; }

  say(text, frames = 150) { this.speech = { text, t: frames }; }

  giveWeapon(key) {
    if (this.weapons.includes(key)) return false;
    this.weapons.push(key);
    this.weapons.sort((a, b) => WEAPON_ORDER.indexOf(a) - WEAPON_ORDER.indexOf(b));
    this.weaponIdx = this.weapons.indexOf(key);
    return true;
  }
  cycleWeapon(dir, game) {
    if (this.weapons.length < 2) return;
    this.weaponIdx = (this.weaponIdx + dir + this.weapons.length) % this.weapons.length;
    game.audio.play('select');
  }
  shoulder() {
    const s = PLAYER_SCALE;
    return { x: this.cx + 4 * s * this.facing, y: this.y + this.h - 41 * s };
  }

  update(game) {
    const I = game.input, lvl = game.level;
    if (this.cooldown > 0) this.cooldown--;
    if (this.invuln > 0) this.invuln--;
    if (this.recoil > 0) this.recoil--;
    if (this.speech && --this.speech.t <= 0) this.speech = null;
    if (--this.blinkT < 0) this.blinkT = randInt(120, 260);

    const ctrl = !this.frozen;
    const left = ctrl && I.down('ArrowLeft', 'KeyA'), right = ctrl && I.down('ArrowRight', 'KeyD');
    const jumpP = ctrl && I.hit('ArrowUp', 'KeyW', 'Space'), jumpH = ctrl && I.down('ArrowUp', 'KeyW', 'Space');
    const downP = ctrl && I.hit('ArrowDown', 'KeyS');

    // horizontal movement
    const accel = this.onGround ? 0.9 : 0.55;
    if (left && !right) { this.vx -= accel; if (this.aimTimer <= 0) this.facing = -1; }
    else if (right && !left) { this.vx += accel; if (this.aimTimer <= 0) this.facing = 1; }
    else this.vx *= this.onGround ? 0.72 : 0.94;
    this.vx = clamp(this.vx, -5.2, 5.2);
    if (Math.abs(this.vx) < 0.05) this.vx = 0;

    // jumping with coyote time + buffer
    this.coyote = this.onGround ? 7 : this.coyote - 1;
    this.jumpBuffer = jumpP ? 8 : this.jumpBuffer - 1;
    if (this.jumpBuffer > 0 && this.coyote > 0) {
      this.vy = -13; this.coyote = 0; this.jumpBuffer = 0;
      game.audio.play('jump');
      game.dust(this.cx, this.y + this.h, 6);
    }
    if (!jumpH && this.vy < 0) this.vy += 0.65; // variable jump height

    // drop through one-way platforms
    if (downP && this.onGround && this.standingOn && this.standingOn.oneWay) {
      this.dropTimer = 14; this.y += 2;
    }
    if (this.dropTimer > 0) this.dropTimer--;

    this.vy = Math.min(this.vy + GRAVITY, 15);
    const wasAir = !this.onGround;
    physicsMove(this, lvl.platforms, this.dropTimer > 0);
    if (wasAir && this.onGround && this.vy === 0) game.dust(this.cx, this.y + this.h, 3);

    // bounds
    const minX = game.arenaLocked ? lvl.arenaStart + 2 : 0;
    const maxX = (game.arenaLocked ? lvl.arenaStart + W - 2 : lvl.width) - this.w;
    if (this.x < minX) { this.x = minX; this.vx = Math.max(0, this.vx); }
    if (this.x > maxX) { this.x = maxX; this.vx = Math.min(0, this.vx); }

    // remember last safe ground for respawn
    if (this.onGround && this.standingOn && this.standingOn.kind === 'ground') {
      const p = this.standingOn;
      this.lastSafe = { x: clamp(this.x, p.x + 20, p.x + p.w - 60), y: p.y - this.h };
    }

    if (this.onGround && Math.abs(this.vx) > 0.3) this.runPhase += Math.abs(this.vx) * 0.075;

    // ----- shooting -----
    let a = null;
    if (ctrl) {
      if (I.mouse.down) {
        const m = game.mouseWorld(), sh = this.shoulder();
        a = Math.atan2(m.y - sh.y, m.x - sh.x);
      } else if (I.down('KeyJ', 'KeyZ')) a = this.facing > 0 ? 0 : Math.PI;
      else if (I.down('KeyK', 'KeyX')) a = this.facing > 0 ? -Math.PI / 4 : -3 * Math.PI / 4;
    }
    if (a !== null) {
      this.aimAngle = a; this.aimTimer = 30;
      this.facing = Math.cos(a) >= 0 ? 1 : -1;
      this.fire(game, a);
    } else if (this.aimTimer > 0) this.aimTimer--;
    else this.aimAngle = this.facing > 0 ? 0 : Math.PI;

    // weapon switching
    if (ctrl) {
      if (I.hit('KeyQ') || I.wheel < 0) this.cycleWeapon(-1, game);
      if (I.hit('KeyE') || I.wheel > 0) this.cycleWeapon(1, game);
      for (let i = 0; i < 4; i++) {
        if (I.hit('Digit' + (i + 1))) {
          const idx = this.weapons.indexOf(WEAPON_ORDER[i]);
          if (idx >= 0 && idx !== this.weaponIdx) { this.weaponIdx = idx; game.audio.play('select'); }
        }
      }
    }

    // trickle regen when nearly empty, so the player is never fully stuck
    if (this.energy < 25) this.energy = Math.min(25, this.energy + 0.05);

    if (this.y > H + 60) game.playerFell();
  }

  fire(game, a) {
    if (this.cooldown > 0) return;
    const w = this.weapon;
    if (this.energy < w.cost) {
      this.cooldown = 18; game.audio.play('empty'); game.energyFlash = 40;
      if (!this.speech) this.say(pick(["I'm out of energy!", "Need a 'Full energy!'", "Running on empty here!"]), 90);
      return;
    }
    this.energy -= w.cost; this.cooldown = w.cooldown; this.recoil = 6;
    const sh = this.shoulder(), len = (w.key === 'cannon' || w.key === 'plasma' ? 48 : 38) * PLAYER_SCALE;
    const mx = sh.x + Math.cos(a) * len, my = sh.y + Math.sin(a) * len;
    const P = (ang, spd, opts) => game.addProjectile(new Projectile(mx, my, Math.cos(ang) * spd, Math.sin(ang) * spd,
      Object.assign({ owner: 'player', color: w.color }, opts)));
    switch (w.key) {
      case 'laser': P(a, 14, { kind: 'laser', damage: 1, r: 4, life: 70 }); break;
      case 'triple': for (const o of [-0.17, 0, 0.17]) P(a + o, 13, { kind: 'laser', damage: 1, r: 4, life: 60 }); break;
      case 'cannon': P(a, 16, { kind: 'cannon', damage: 3, r: 9, life: 60, pierce: true }); this.vx -= Math.cos(a) * 2; break;
      case 'plasma': P(a, 9, { kind: 'plasma', damage: 5, r: 11, life: 90, explode: 85 }); this.vx -= Math.cos(a) * 3; game.shake = Math.max(game.shake, 4); break;
    }
    for (let i = 0; i < 5; i++) game.particles.push(new Particle(mx, my, Math.cos(a) * rand(1, 4) + rand(-1, 1), Math.sin(a) * rand(1, 4) + rand(-1, 1), 12, w.color, 4, { glow: true, gravity: 0 }));
    game.audio.play(w.sound);
  }

  draw(ctx, game) {
    if (this.hidden) return;
    if (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.4;
    let local = this.aimAngle;
    if (this.facing < 0) local = Math.PI - local;
    local = Math.atan2(Math.sin(local), Math.cos(local));
    drawModi(ctx, this.cx, this.y + this.h + 1, PLAYER_SCALE, this.facing, {
      runPhase: this.runPhase, moving: Math.abs(this.vx) > 0.4, air: !this.onGround,
      aim: local, weapon: this.weapons[this.weaponIdx], recoil: this.recoil, blink: this.blinkT < 8,
      shout: this.recoil > 0,
    });
    ctx.globalAlpha = 1;
    if (this.speech) drawSpeech(ctx, this.cx, this.y - 26, this.speech.text);
  }
}

function drawSpeech(ctx, x, y, text) {
  ctx.save();
  ctx.font = `bold 15px system-ui, -apple-system, "Segoe UI", sans-serif`;
  const tw = ctx.measureText(text).width, bw = tw + 22, bh = 30;
  const bx = clamp(x - bw / 2, game.camX + 6, game.camX + W - bw - 6), by = y - bh;
  pathRoundRect(ctx, bx, by, bw, bh, 12);
  ctx.moveTo(x - 6, by + bh - 1); ctx.lineTo(x, by + bh + 10); ctx.lineTo(x + 6, by + bh - 1);
  fillStroke(ctx, '#fff', 2.5);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 5, by + bh - 4, 10, 4);
  plainText(ctx, text, bx + bw / 2, by + bh / 2 + 1, 15, OUTLINE, 'center');
  ctx.restore();
}

/* ---------------- Projectiles ---------------- */
class Projectile extends Entity {
  constructor(x, y, vx, vy, o) {
    super(x - o.r, y - o.r, o.r * 2, o.r * 2);
    this.vx = vx; this.vy = vy;
    this.owner = o.owner; this.kind = o.kind; this.color = o.color || '#7dff5a';
    this.damage = o.damage || 1; this.r = o.r; this.life = o.life || 120;
    this.pierce = !!o.pierce; this.hitSet = new Set();
    this.gravity = o.gravity || 0; this.explode = o.explode || 0;
    this.noCollide = !!o.noCollide; this.t = 0;
  }
  update(game) {
    this.t++;
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    if (--this.life <= 0) { this.dead = true; if (this.explode && this.owner === 'player') game.detonate(this); }
    if (this.y > H + 60 || this.x < game.camX - 300 || this.x > game.camX + W + 300) this.dead = true;
    if (!this.noCollide && !this.dead) {
      for (const p of game.level.platforms) {
        if (!p.oneWay && overlap(this, p)) {
          this.dead = true;
          if (this.explode) game.detonate(this);
          else game.sparks(this.cx, this.cy, this.color, 5);
          break;
        }
      }
    }
    if (this.kind === 'missile' && this.t % 2 === 0)
      game.particles.push(new Particle(this.cx, this.cy, rand(-0.5, 0.5), rand(-0.5, 0.5), 25, '#aaa', 6, { gravity: -0.02, kind: 'smoke' }));
    if (this.kind === 'plasma' && this.t % 2 === 0)
      game.particles.push(new Particle(this.cx, this.cy, rand(-1, 1), rand(-1, 1), 18, this.color, 5, { glow: true, gravity: 0 }));
  }
  draw(ctx) {
    const cx = this.cx, cy = this.cy, a = Math.atan2(this.vy, this.vx);
    ctx.save();
    switch (this.kind) {
      case 'laser':
      case 'cannon': {
        const L = this.kind === 'cannon' ? 42 : 22, wd = this.kind === 'cannon' ? 16 : 7;
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(cx, cy); ctx.rotate(a); ctx.lineCap = 'round';
        drawLine(ctx, -L, 0, 0, 0, this.color, wd);
        drawLine(ctx, -L + 4, 0, 0, 0, '#ffffff', wd * 0.35);
        break;
      }
      case 'plasma': {
        ctx.globalCompositeOperation = 'lighter';
        const pr = this.r + Math.sin(this.t * 0.5) * 2;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, pr * 2);
        g.addColorStop(0, '#fff'); g.addColorStop(0.35, this.color); g.addColorStop(1, 'rgba(208,80,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, pr * 2, 0, TAU); ctx.fill();
        break;
      }
      case 'orb': {
        ctx.shadowColor = this.color; ctx.shadowBlur = 10;
        drawCircle(ctx, cx, cy, this.r, this.color, 2);
        ctx.shadowBlur = 0;
        drawCircle(ctx, cx - 1, cy - 1, this.r * 0.4, '#fff', 0);
        break;
      }
      case 'bomb': {
        drawCircle(ctx, cx, cy, this.r, '#2b2b3a', 2.5);
        drawCircle(ctx, cx, cy, 3, Math.floor(this.t / 5) % 2 ? '#ff3030' : '#ffdd30', 1.5);
        drawLine(ctx, cx, cy - this.r, cx + 3, cy - this.r - 5, '#a07040', 2);
        break;
      }
      case 'missile': {
        ctx.translate(cx, cy); ctx.rotate(a);
        drawPoly(ctx, [-10, -4, -14, -8, -12, 0, -14, 8, -10, 4], '#555', 1.5);
        drawRRect(ctx, -11, -4, 18, 8, 3, '#d8d8e0', 2);
        drawPoly(ctx, [7, -4, 14, 0, 7, 4], '#ff4040', 2);
        ctx.globalCompositeOperation = 'lighter';
        drawCircle(ctx, -15, 0, 4 + Math.random() * 2, '#ffa020', 0);
        break;
      }
      case 'wave': {
        ctx.globalCompositeOperation = 'lighter';
        const bottom = this.y + this.h;
        const g = ctx.createLinearGradient(0, bottom - 40, 0, bottom);
        g.addColorStop(0, 'rgba(255,200,50,0)'); g.addColorStop(1, 'rgba(255,140,30,0.9)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(this.x - 6, bottom);
        ctx.quadraticCurveTo(cx, bottom - 50 - Math.sin(this.t * 0.6) * 6, this.x + this.w + 6, bottom);
        ctx.fill();
        break;
      }
    }
    ctx.restore();
  }
}

/* ---------------- Items ---------------- */
class Item extends Entity {
  constructor(cx, cy, kind, data) {
    const sz = { coin: 24, energy: 30, health: 26, weapon: 38 }[kind] || 24;
    super(cx - sz / 2, cy - sz / 2, sz, sz);
    this.kind = kind; this.data = data;
    this.baseY = this.y; this.t = Math.random() * TAU;
    this.falling = false;
  }
  update(game) {
    this.t += 0.07;
    if (this.falling) {
      this.vy = Math.min(this.vy + 0.3, 8); this.y += this.vy;
      for (const p of game.level.platforms) {
        if (p.kind === 'ground' && this.cx > p.x && this.cx < p.x + p.w && this.y + this.h >= p.y - 6) {
          this.y = p.y - this.h - 8; this.baseY = this.y; this.falling = false; break;
        }
      }
      if (this.y > H + 50) this.dead = true;
    } else this.y = this.baseY + Math.sin(this.t) * 4;
  }
  draw(ctx) {
    const cx = this.cx, cy = this.cy, t = this.t;
    ctx.save();
    switch (this.kind) {
      case 'coin': {
        ctx.translate(cx, cy);
        ctx.scale(Math.max(0.15, Math.abs(Math.cos(t * 0.8))), 1);
        drawCircle(ctx, 0, 0, 11, '#ffc933', 2.5);
        drawCircle(ctx, 0, 0, 7.5, '#ffe58a', 1.5);
        drawRupeeSymbol(ctx, 0, 0, 6.5, '#b37700', 1.8);
        break;
      }
      case 'energy': {
        ctx.globalAlpha = 0.35 + Math.sin(t * 2) * 0.15;
        drawCircle(ctx, cx, cy, 22, '#7dffb0', 0);
        ctx.globalAlpha = 1;
        drawRRect(ctx, cx - 4, cy - 17, 8, 5, 2, '#bbb', 2);
        drawRRect(ctx, cx - 11, cy - 13, 22, 28, 5, '#2fd47a', 3);
        drawPoly(ctx, [cx + 2, cy - 10, cx - 6, cy + 2, cx - 0.5, cy + 2, cx - 2.5, cy + 12, cx + 6, cy - 1, cx + 0.5, cy - 1], '#fff35a', 1.6);
        cartoonText(ctx, 'FULL ENERGY!', cx, cy - 28, 13, '#7dffb0', 'center', 3);
        break;
      }
      case 'health': {
        const s = 1 + Math.sin(t * 3) * 0.08;
        ctx.translate(cx, cy); ctx.scale(s, s);
        ctx.beginPath(); ctx.moveTo(0, 10);
        ctx.bezierCurveTo(-16, -1, -10, -15, 0, -6);
        ctx.bezierCurveTo(10, -15, 16, -1, 0, 10);
        fillStroke(ctx, '#ff4a6a', 2.5);
        drawCircle(ctx, -5, -5, 2.5, 'rgba(255,255,255,0.8)', 0);
        break;
      }
      case 'weapon': {
        const w = WEAPONS[this.data];
        ctx.globalAlpha = 0.4 + Math.sin(t * 2) * 0.2;
        drawCircle(ctx, cx, cy, 28, w.color, 0);
        ctx.globalAlpha = 1;
        drawRRect(ctx, cx - 20, cy - 16, 40, 32, 6, '#2c3350', 3);
        ctx.strokeStyle = w.color; ctx.lineWidth = 2; ctx.strokeRect(cx - 15, cy - 11, 30, 22);
        ctx.save(); ctx.translate(cx - 12, cy + 1); drawGun(ctx, this.data, 0.75); ctx.restore();
        cartoonText(ctx, w.name.toUpperCase(), cx, cy - 30, 15, w.color, 'center', 3.5);
        break;
      }
    }
    ctx.restore();
  }
}

/* ---------------- Flagpole ---------------- */
class Flag {
  constructor(x) {
    this.x = x; this.top = GROUND_Y - 230;
    this.active = false; this.appear = 0; this.captured = false; this.raise = 0;
  }
  get rect() { return { x: this.x - 14, y: this.top, w: 28, h: GROUND_Y - this.top }; }
  update() {
    if (this.active && this.appear < 1) this.appear = Math.min(1, this.appear + 0.02);
    if (this.captured && this.raise < 1) this.raise = Math.min(1, this.raise + 0.012);
  }
  draw(ctx, t) {
    if (!this.active) return;
    const h = (GROUND_Y - this.top) * this.appear, top = GROUND_Y - h;
    drawRRect(ctx, this.x - 18, GROUND_Y - 16, 36, 16, 3, '#9a9aa8', 3);
    drawRRect(ctx, this.x - 3.5, top, 7, h - 14, 3, '#e0e0ea', 2.5);
    drawCircle(ctx, this.x, top - 4, 7, '#ffcc33', 2.5);
    if (this.appear < 1) return;
    // alien flag at top until captured, then Indian flag rises
    if (!this.captured) {
      this.drawWavy(ctx, this.x + 4, this.top + 6, 60, 40, t, (c, i, x, y, w, h) => {
        ctx.fillStyle = '#5bd65b'; ctx.fillRect(x, y, w, h);
        if (i > 4 && i < 11) { ctx.fillStyle = '#1b1b2a'; ctx.fillRect(x, y + 12, w, 6); }
      });
    } else {
      const fy = lerp(GROUND_Y - 60, this.top + 6, this.raise);
      this.drawWavy(ctx, this.x + 4, fy, 64, 42, t, (c, i, x, y, w, h) => {
        const sh = h / 3;
        ctx.fillStyle = '#ff9933'; ctx.fillRect(x, y, w, sh + 0.5);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y + sh, w, sh + 0.5);
        ctx.fillStyle = '#138808'; ctx.fillRect(x, y + sh * 2, w, sh + 0.5);
        if (i >= 6 && i <= 9) {
          ctx.strokeStyle = '#000080'; ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, sh * 0.4, 0, TAU); ctx.stroke();
        }
      });
    }
  }
  drawWavy(ctx, x, y, w, h, t, painter) {
    const cols = 16, cw = w / cols;
    for (let i = 0; i < cols; i++) {
      const off = Math.sin(t * 0.12 + i * 0.5) * 3 * (i / cols);
      painter(ctx, i, x + i * cw, y + off, cw + 0.6, h);
    }
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i <= cols; i++) ctx.lineTo(x + i * cw, y + Math.sin(t * 0.12 + i * 0.5) * 3 * (i / cols));
    for (let i = cols; i >= 0; i--) ctx.lineTo(x + i * cw, y + h + Math.sin(t * 0.12 + i * 0.5) * 3 * (i / cols));
    ctx.closePath(); ctx.stroke();
  }
}

/* ---------------- Particles & floating text ---------------- */
class Particle {
  constructor(x, y, vx, vy, life, color, size, o = {}) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
    this.gravity = o.gravity ?? 0.15; this.glow = !!o.glow; this.kind = o.kind || 'dot';
    this.drag = o.drag ?? 0.97; this.dead = false;
  }
  update() {
    this.vx *= this.drag; this.vy *= this.drag; this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    if (--this.life <= 0) this.dead = true;
  }
  draw(ctx) {
    const k = this.life / this.maxLife;
    ctx.save();
    if (this.kind === 'ring') {
      ctx.globalAlpha = k; ctx.strokeStyle = this.color; ctx.lineWidth = 6 * k + 1;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1 - k) + 4, 0, TAU); ctx.stroke();
    } else if (this.kind === 'smoke') {
      ctx.globalAlpha = k * 0.6; ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1.6 - k), 0, TAU); ctx.fill();
    } else if (this.kind === 'debris') {
      ctx.translate(this.x, this.y); ctx.rotate(this.life * 0.3);
      ctx.fillStyle = this.color; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5;
      ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size); ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
    } else {
      if (this.glow) ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, k * 1.5); ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.5, this.size * k), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

class FloatText {
  constructor(x, y, text, color = '#fff', size = 22) {
    this.x = x; this.y = y; this.text = text; this.color = color; this.size = size;
    this.life = 70; this.dead = false;
  }
  update() { this.y -= 0.7; if (--this.life <= 0) this.dead = true; }
  draw(ctx) {
    ctx.globalAlpha = Math.min(1, this.life / 20);
    cartoonText(ctx, this.text, this.x, this.y, this.size, this.color);
    ctx.globalAlpha = 1;
  }
}


'use strict';
/* ===========================================================
   Enemies: Grunt, Flyer, UFO, Brute, Hopper + 3 bosses
   =========================================================== */

class Enemy extends Entity {
  constructor(x, y, w, h, hp, score, diff = 1) {
    super(x, y, w, h);
    this.hp = hp; this.maxHp = hp; this.score = score; this.diff = diff;
    this.flash = 0; this.facing = -1; this.t = randInt(0, 200);
    this.active = false; this.shootTimer = rand(60, 140); this.contactDmg = 1;
  }
  activate(game) { this.active = true; if (Math.random() < 0.45) game.audio.play('alien'); }
  hit(dmg, game) {
    if (this.dead) return;
    this.hp -= dmg; this.flash = 6;
    if (this.hp <= 0) { this.dead = true; game.onEnemyKilled(this); }
    else game.audio.play('hit');
  }
  get bulletSpeed() { return 3.4 + this.diff * 0.9; }
  aim(game, fx = this.cx, fy = this.cy) { const p = game.player; return Math.atan2(p.cy - fy, p.cx - fx); }
  shoot(game, ang, speed = this.bulletSpeed, fx = this.cx, fy = this.cy, opts = {}) {
    game.enemyShot(fx, fy, Math.cos(ang) * speed, Math.sin(ang) * speed, opts);
  }
  physics(game) { this.vy = Math.min(this.vy + GRAVITY, 14); physicsMove(this, game.level.platforms); if (this.y > H + 80) this.dead = true; }
  canWalk(game, dir) {
    if (!this.onGround) return true;
    const fx = dir > 0 ? this.x + this.w + 4 : this.x - 4;
    return groundBelow(fx, this.y + this.h, game.level.platforms);
  }
  beginDraw(ctx) { if (this.flash > 0 && this.flash % 2 === 0) ctx.globalAlpha = 0.45; }
  endDraw(ctx) {
    ctx.globalAlpha = 1;
    if (this.hp < this.maxHp && !this.isBoss) {
      const bw = Math.max(30, this.w * 0.8), bx = this.cx - bw / 2, by = this.y - 12;
      drawRRect(ctx, bx, by, bw, 6, 3, '#331b1b', 2);
      ctx.fillStyle = '#ff5a5a'; ctx.fillRect(bx + 1, by + 1, (bw - 2) * Math.max(0, this.hp / this.maxHp), 4);
    }
  }
}

/* ---------- Basic alien: walks toward the player and shoots ---------- */
class Grunt extends Enemy {
  constructor(x, y, diff) { super(x, y, 30, 44, 3, 100, diff); this.speed = 1.1 + diff * 0.25; }
  update(game) {
    this.t++;
    const p = game.player, dx = p.cx - this.cx;
    this.facing = dx < 0 ? -1 : 1;
    let mv = 0;
    if (Math.abs(dx) > 170) mv = this.facing * this.speed;
    else if (Math.abs(dx) < 90) mv = -this.facing * this.speed * 0.6;
    if (mv && !this.canWalk(game, Math.sign(mv))) mv = 0;
    this.vx = mv; this.moving = mv !== 0;
    this.physics(game);
    if (--this.shootTimer <= 0 && Math.abs(dx) < 540 && Math.abs(p.cy - this.cy) < 250) {
      this.shootTimer = rand(100, 170) / this.diff;
      const fx = this.cx + this.facing * 20, fy = this.y + 24;
      this.shoot(game, this.aim(game, fx, fy) + rand(-0.08, 0.08), this.bulletSpeed, fx, fy);
    }
  }
  draw(ctx) {
    this.beginDraw(ctx);
    const bob = this.moving ? Math.sin(this.t * 0.3) * 2 : Math.sin(this.t * 0.08);
    const leg = this.moving ? Math.sin(this.t * 0.3) * 4 : 0;

    drawRRect(ctx, 2 - leg, -13, 7, 13, 3, '#3a9e3a', 2.5);

    ctx.fillStyle = '#2d6e2d'; ctx.fillRect(-9, -15 + bob * 0.5, 18, 3);
    drawLine(ctx, 0, -46 + bob, 4, -56 + bob, OUTLINE, 2.5);
    drawCircle(ctx, 4, -57 + bob, 3.5, '#ff5ad1', 2);
    drawEllipse(ctx, 0, -37 + bob, 15, 12.5, '#7cf07c', 3);
    drawEllipse(ctx, -4, -37 + bob, 4.5, 6.5, '#111', 1.5, -0.5);
    drawEllipse(ctx, 7, -37 + bob, 4.5, 6.5, '#111', 1.5, 0.5);
    drawCircle(ctx, -3, -39 + bob, 1.5, '#fff', 0); drawCircle(ctx, 8, -39 + bob, 1.5, '#fff', 0);
    drawLine(ctx, -1, -30 + bob, 4, -30.5 + bob, OUTLINE, 1.8);

    ctx.restore();
    this.endDraw(ctx);
  }
}

/* ---------- Flying alien: hovers above and shoots down ---------- */
class Flyer extends Enemy {
  constructor(x, y, diff) { super(x, y, 40, 32, 2, 150, diff); this.homeY = y; this.offset = rand(-200, 200); }
  update(game) {
    this.t++;
    const p = game.player;
    const tx = p.cx + this.offset + Math.sin(this.t * 0.02) * 120 - this.w / 2;
    const ty = this.homeY + Math.sin(this.t * 0.05) * 35;
    this.x += clamp((tx - this.x) * 0.02, -2.5 - this.diff, 2.5 + this.diff);
    this.y += (ty - this.y) * 0.04;
    this.facing = p.cx < this.cx ? -1 : 1;
    if (--this.shootTimer <= 0 && Math.abs(p.cx - this.cx) < 450) {
      this.shootTimer = rand(110, 170) / this.diff;
      this.shoot(game, this.aim(game), this.bulletSpeed * 0.9, this.cx, this.y + this.h, { color: '#ff7af0' });
    }
  }
  draw(ctx, game) {
    this.beginDraw(ctx);
    const cx = this.cx, cy = this.cy, flap = Math.sin(this.t * 0.5) * 0.6;
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(cx + s * 8, cy - 4); ctx.rotate(s * (-0.3 + flap));
      drawEllipse(ctx, s * 16, -4, 16, 7, 'rgba(210,180,255,0.75)', 2.5);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
    drawCircle(ctx, cx, cy + 16 + Math.random() * 3, 5, '#ffa030', 0);
    ctx.globalCompositeOperation = 'source-over';
    drawEllipse(ctx, cx, cy + 3, 14, 13, '#9b59d9', 3);
    drawEllipse(ctx, cx, cy + 1, 9, 8, '#fff', 2);
    const a = Math.atan2(game.player.cy - cy, game.player.cx - cx);
    drawCircle(ctx, cx + Math.cos(a) * 3.5, cy + 1 + Math.sin(a) * 3.5, 4, '#d42020', 1.5);
    drawCircle(ctx, cx + Math.cos(a) * 3.5, cy + 1 + Math.sin(a) * 3.5, 1.8, '#111', 0);
    drawLine(ctx, cx - 6, cy - 10, cx - 9, cy - 18, OUTLINE, 2); drawLine(ctx, cx + 6, cy - 10, cx + 9, cy - 18, OUTLINE, 2);
    drawCircle(ctx, cx - 9, cy - 18, 2.5, '#ffef5a', 1.5); drawCircle(ctx, cx + 9, cy - 18, 2.5, '#ffef5a', 1.5);
    this.endDraw(ctx);
  }
}

/* ---------- UFO: large flying saucer ---------- */
class UFO extends Enemy {
  constructor(x, y, diff) { super(x, y, 96, 44, 14, 500, diff); this.homeY = y; this.bombTimer = 90; this.shootTimer = 160; }
  activate(game) { this.active = true; game.audio.play('alien'); }
  update(game) {
    this.t++;
    const p = game.player;
    const tx = p.cx + Math.sin(this.t * 0.012) * 220 - this.w / 2;
    this.vx = clamp((tx - this.x) * 0.02, -2.2 - this.diff * 0.4, 2.2 + this.diff * 0.4);
    this.x += this.vx;
    this.y = this.homeY + Math.sin(this.t * 0.04) * 10;
    if (--this.bombTimer <= 0 && Math.abs(p.cx - this.cx) < 260) {
      this.bombTimer = rand(70, 110) / this.diff;
      game.enemyShot(this.cx, this.y + this.h, this.vx * 0.5, 1, { kind: 'bomb', r: 8, gravity: 0.22, explode: 55, life: 300 });
    }
    if (--this.shootTimer <= 0) {
      this.shootTimer = rand(140, 200) / this.diff;
      const a = this.aim(game);
      for (const o of [-0.25, 0, 0.25]) this.shoot(game, a + o, this.bulletSpeed, this.cx, this.y + this.h - 6, { color: '#ffef5a' });
    }
  }
  draw(ctx) {
    this.beginDraw(ctx);
    const cx = this.cx, cy = this.cy, t = this.t;
    if (this.bombTimer < 25) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
      drawPoly(ctx, [cx - 16, cy + 14, cx + 16, cy + 14, cx + 34, cy + 60, cx - 34, cy + 60], '#9dff7a', 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      this.beginDraw(ctx);
    }
    drawEllipse(ctx, cx, cy - 6, 24, 20, 'rgba(160,240,255,0.55)', 3);
    drawEllipse(ctx, cx, cy - 6, 9, 8, '#7cf07c', 2);
    drawEllipse(ctx, cx - 3, cy - 7, 2.5, 3.5, '#111', 0); drawEllipse(ctx, cx + 4, cy - 7, 2.5, 3.5, '#111', 0);
    drawEllipse(ctx, cx, cy + 6, 48, 13, '#a3abbd', 3);
    drawEllipse(ctx, cx, cy + 3, 48, 5, '#c9d0de', 0);
    drawEllipse(ctx, cx, cy + 15, 18, 5, '#5d6577', 2);
    const cols = ['#ff4a4a', '#ffef5a', '#5affdc', '#ff5ad1'];
    for (let i = 0; i < 7; i++) drawCircle(ctx, cx - 36 + i * 12, cy + 8, 3, cols[(i + Math.floor(t / 6)) % 4], 1.5);
    this.endDraw(ctx);
  }
}

/* ---------- Brute: heavily armored alien with burst fire ---------- */
class Brute extends Enemy {
  constructor(x, y, diff) { super(x, y, 48, 64, 10, 300, diff); this.burst = 0; this.speed = 0.6 + diff * 0.2; }
  update(game) {
    this.t++;
    const p = game.player, dx = p.cx - this.cx;
    this.facing = dx < 0 ? -1 : 1;
    let mv = Math.abs(dx) > 220 ? this.facing * this.speed : 0;
    if (mv && !this.canWalk(game, Math.sign(mv))) mv = 0;
    this.vx = mv; this.moving = mv !== 0;
    this.physics(game);
    if (this.burst > 0) {
      if (this.t % 9 === 0) {
        this.burst--;
        const fx = this.cx + this.facing * 34, fy = this.y + 30;
        this.shoot(game, this.aim(game, fx, fy), this.bulletSpeed * 1.1, fx, fy, { color: '#ff8a3a', r: 7 });
      }
    } else if (--this.shootTimer <= 0 && Math.abs(dx) < 560) {
      this.shootTimer = rand(150, 220) / this.diff; this.burst = 3;
    }
  }
  draw(ctx) {
    this.beginDraw(ctx);
    const step = this.moving ? Math.sin(this.t * 0.18) * 4 : 0;
    ctx.save(); ctx.translate(this.cx, this.y + this.h); ctx.scale(this.facing, 1);
    drawRRect(ctx, -16 + step, -18, 13, 18, 4, '#8f2d2d', 3);
    drawRRect(ctx, 3 - step, -18, 13, 18, 4, '#8f2d2d', 3);
    drawRRect(ctx, -22, -48, 44, 34, 10, '#d94a3a', 3);
    drawRRect(ctx, -16, -44, 32, 22, 6, '#7b8496', 3);
    ctx.fillStyle = '#5d6577'; ctx.fillRect(-12, -37, 24, 3); ctx.fillRect(-12, -30, 24, 3);
    drawEllipse(ctx, 2, -56, 16, 12, '#e86a5a', 3);
    drawPoly(ctx, [-12, -62, -18, -74, -6, -66], '#f2e6c8', 2.5);
    drawPoly(ctx, [12, -64, 18, -76, 6, -67], '#f2e6c8', 2.5);
    drawRRect(ctx, -4, -60, 18, 6, 3, '#ffef5a', 2);
    drawRRect(ctx, 10, -36, 30, 12, 4, '#4f566a', 3);
    drawRRect(ctx, 36, -34, 7, 8, 2, '#ff8a3a', 2);
    ctx.restore();
    this.endDraw(ctx);
  }
}

/* ---------- Hopper: leaps at the player ---------- */
class Hopper extends Enemy {
  constructor(x, y, diff) { super(x, y, 34, 32, 3, 200, diff); this.hopTimer = rand(40, 90); }
  update(game) {
    this.t++;
    const p = game.player, dx = p.cx - this.cx;
    if (this.onGround) {
      this.vx = 0; this.facing = dx < 0 ? -1 : 1;
      if (--this.hopTimer <= 0 && Math.abs(dx) < 600) {
        this.hopTimer = rand(50, 90) / this.diff;
        this.vy = -9 - rand(0, 3); this.vx = this.facing * clamp(Math.abs(dx) / 40, 2, 4.5);
        game.audio.play('jump');
      }
    }
    this.physics(game);
    if (!this.onGround && this.vy > 0 && this.vy < 0.7 && Math.random() < 0.5)
      this.shoot(game, this.aim(game), this.bulletSpeed, this.cx, this.cy, { color: '#5affdc', r: 5 });
  }
  draw(ctx) {
    this.beginDraw(ctx);
    const squash = this.onGround ? 1 + Math.max(0, 20 - this.hopTimer) * 0.012 : 0.85;
    ctx.save(); ctx.translate(this.cx, this.y + this.h); ctx.scale(this.facing * squash, 2 - squash);
    drawEllipse(ctx, -12, -6, 9, 6, '#2c7fd6', 2.5); drawEllipse(ctx, 12, -6, 9, 6, '#2c7fd6', 2.5);
    drawEllipse(ctx, 0, -17, 17, 14, '#4aa8ff', 3);
    drawEllipse(ctx, 0, -12, 10, 6, '#bfe3ff', 0);
    for (const [ex, ey] of [[-8, -28], [0, -32], [8, -28]]) { drawCircle(ctx, ex, ey, 5, '#fff', 2); drawCircle(ctx, ex + 1.5, ey, 2, '#111', 0); }
    ctx.beginPath(); ctx.arc(4, -15, 6, 0.2, Math.PI - 0.6); ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    this.endDraw(ctx);
  }
}

function createEnemy(type, x, y, diff) {
  switch (type) {
    case 'grunt': return new Grunt(x, y, diff);
    case 'flyer': return new Flyer(x, y, diff);
    case 'ufo': return new UFO(x, y, diff);
    case 'brute': return new Brute(x, y, diff);
    case 'hopper': return new Hopper(x, y, diff);
  }
  throw new Error('Unknown enemy ' + type);
}

/* ===========================================================
   Bosses
   =========================================================== */
class Boss extends Enemy {
  constructor(x, y, w, h, hp, name, game) {
    super(x, y, w, h, hp, 5000, game.level.def.diff);
    this.isBoss = true; this.name = name; this.active = true;
    this.dying = 0; this.atkTimer = 140; this.atkIdx = 0; this.introT = 140; this.st = null;
    this.arenaX = game.level.arenaStart;
  }
  activate() { this.active = true; }
  get phase2() { return this.hp < this.maxHp * 0.5; }
  hit(dmg, game) {
    if (this.dying || this.dead || this.introT > 40) return;
    this.hp -= dmg; this.flash = 4;
    if (this.hp <= 0) { this.hp = 0; this.dying = 150; game.onBossDying(this); }
    else if (Math.random() < 0.35) game.audio.play('hit');
  }
  update(game) {
    this.t++;
    if (this.introT > 0) this.introT--;
    if (this.dying > 0) {
      this.dying--;
      if (this.dying % 7 === 0) {
        game.explode(this.x + Math.random() * this.w, this.y + Math.random() * this.h, 1.2);
        game.shake = Math.max(game.shake, 8);
      }
      if (this.dying === 0) { this.dead = true; game.explode(this.cx, this.cy, 4); game.onBossDefeated(this); }
      return;
    }
    this.behave(game);
  }
  minions(game, cls) { return game.level.enemies.filter(e => !e.dead && e instanceof cls).length; }
  spawnMinion(game, e) { e.active = true; game.level.enemies.push(e); game.particles.push(new Particle(e.cx, e.cy, 0, 0, 25, '#7dff5a', 50, { kind: 'ring', gravity: 0 })); }
  draw(ctx, game) {
    this.beginDraw(ctx);
    if (this.dying) { ctx.save(); ctx.translate(rand(-3, 3), rand(-3, 3)); }
    this.drawBody(ctx, game);
    if (this.dying) ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* --- Level 1: Zorg the Overlord - a giant brain in a hover-pod --- */
class OverlordBoss extends Boss {
  constructor(game) {
    super(game.level.arenaStart + 480 - 65, -200, 130, 110, 70, 'ZORG THE OVERLORD', game);
  }
  behave(game) {
    const spd = this.phase2 ? 0.02 : 0.013;
    const tx = this.arenaX + 480 + Math.sin(this.t * spd) * 320 - this.w / 2;
    const ty = this.introT > 0 ? lerp(110, -200, this.introT / 140) : 105 + Math.sin(this.t * 0.035) * 35;
    this.x += (tx - this.x) * 0.05; this.y += (ty - this.y) * 0.08;
    if (this.introT > 0 || --this.atkTimer > 0) return;
    const pats = this.phase2 ? ['spread', 'ring', 'summon', 'rain', 'spread', 'ring'] : ['spread', 'rain', 'spread', 'summon'];
    const pat = pats[this.atkIdx++ % pats.length];
    const sp = this.bulletSpeed;
    switch (pat) {
      case 'spread': {
        const n = this.phase2 ? 7 : 5, a = this.aim(game);
        for (let i = 0; i < n; i++) this.shoot(game, a + (i - (n - 1) / 2) * 0.17, sp, this.cx, this.cy + 10, { color: '#ff7af0', r: 7 });
        this.atkTimer = this.phase2 ? 65 : 95; break;
      }
      case 'ring': {
        for (let i = 0; i < 16; i++) this.shoot(game, i / 16 * TAU + this.t * 0.1, sp * 0.8, this.cx, this.cy, { color: '#ffef5a' });
        this.atkTimer = 80; break;
      }
      case 'summon': {
        if (this.minions(game, Grunt) < 3) {
          this.spawnMinion(game, new Grunt(this.arenaX + 60, 80, this.diff));
          this.spawnMinion(game, new Grunt(this.arenaX + 870, 80, this.diff));
          game.audio.play('alien');
        }
        this.atkTimer = 90; break;
      }
      case 'rain': {
        for (let i = 0; i < 9; i++) {
          const x = this.arenaX + 50 + i * 108 + rand(-20, 20);
          game.enemyShot(x, -20 - i * 30, 0, 3.2, { color: '#7dff5a', r: 9, noCollide: false });
        }
        game.audio.play('warn');
        this.atkTimer = 110; break;
      }
    }
  }
  drawBody(ctx, game) {
    const cx = this.cx, cy = this.cy, t = this.t;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const bx = cx - 40 + i * 20;
      ctx.beginPath(); ctx.moveTo(bx, cy + 30);
      for (let k = 1; k <= 4; k++) ctx.lineTo(bx + Math.sin(t * 0.08 + i + k) * 9, cy + 30 + k * 12);
      ctx.lineWidth = 10; ctx.strokeStyle = OUTLINE; ctx.stroke();
      ctx.lineWidth = 6; ctx.strokeStyle = '#8d4bbd'; ctx.stroke();
    }
    drawEllipse(ctx, cx, cy + 24, 64, 19, '#8f97a8', 3.5);
    drawEllipse(ctx, cx, cy + 20, 60, 8, '#b5bccb', 0);
    for (let i = 0; i < 6; i++) drawCircle(ctx, cx - 45 + i * 18, cy + 28, 4, (i + Math.floor(t / 8)) % 2 ? '#ff4a4a' : '#ffef5a', 1.5);
    ctx.beginPath(); ctx.arc(cx, cy + 16, 50, Math.PI, 0); ctx.closePath();
    fillStroke(ctx, 'rgba(170,230,255,0.3)', 3);
    const pulse = Math.sin(t * 0.1) * 1.5;
    drawBlob(ctx, [[cx - 20, cy - 2, 19 + pulse], [cx + 20, cy - 2, 19 + pulse], [cx, cy - 16, 22 + pulse], [cx - 8, cy + 6, 17], [cx + 10, cy + 6, 17]], this.phase2 ? '#ff7ab0' : '#ffa3cc', 3);
    ctx.strokeStyle = '#d0608f'; ctx.lineWidth = 2.5;
    for (const [x, y, r, a0] of [[-22, -6, 9, 0.5], [18, -8, 10, 2.5], [0, -24, 9, 4], [-6, 8, 7, 1], [22, 8, 6, 3]]) {
      ctx.beginPath(); ctx.arc(cx + x, cy + y, r, a0, a0 + 2.6); ctx.stroke();
    }
    drawEllipse(ctx, cx, cy - 2, 15, 12, '#fff', 3);
    const a = Math.atan2(game.player.cy - cy, game.player.cx - cx);
    drawCircle(ctx, cx + Math.cos(a) * 5, cy - 2 + Math.sin(a) * 4, 6, '#d42020', 2);
    drawCircle(ctx, cx + Math.cos(a) * 6, cy - 2 + Math.sin(a) * 5, 2.5, '#111', 0);
    drawLine(ctx, cx - 18, cy - 20, cx + 2, cy - 12, OUTLINE, 5);
    drawLine(ctx, cx + 18, cy - 20, cx - 2, cy - 12, OUTLINE, 5);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy + 16, 42, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();
  }
}

/* --- Level 2: The Mothership - giant saucer with a death beam --- */
class MothershipBoss extends Boss {
  constructor(game) {
    super(game.level.arenaStart + 480 - 135, -200, 270, 96, 110, 'THE MOTHERSHIP', game);
    this.beamX = 0;
  }
  behave(game) {
    const p = game.player;
    if (this.introT > 0) { this.y = lerp(55, -200, this.introT / 140); return; }
    if (!this.st) {
      const tx = this.arenaX + 480 + Math.sin(this.t * (this.phase2 ? 0.013 : 0.009)) * 280 - this.w / 2;
      this.x += (tx - this.x) * 0.04;
      this.y = 55 + Math.sin(this.t * 0.03) * 10;
      if (--this.atkTimer <= 0) {
        const pats = this.phase2 ? ['beam', 'bombs', 'spread', 'flyers', 'beam', 'spread'] : ['bombs', 'spread', 'beam', 'flyers'];
        this.st = { n: pats[this.atkIdx++ % pats.length], t: 0 };
      }
      return;
    }
    const st = this.st; st.t++;
    const done = () => { this.st = null; this.atkTimer = this.phase2 ? 45 : 75; };
    switch (st.n) {
      case 'bombs':
        this.x += Math.sin(this.t * 0.03) * 2;
        if (st.t % (this.phase2 ? 8 : 11) === 0)
          game.enemyShot(this.cx + rand(-100, 100), this.y + this.h - 10, rand(-1.5, 1.5), 0, { kind: 'bomb', r: 9, gravity: 0.2, explode: 60, life: 300 });
        if (st.t > 70) done();
        break;
      case 'spread':
        if (st.t % 16 === 0) {
          for (const tx of [-90, 90]) {
            const fx = this.cx + tx, fy = this.y + this.h - 12, a = this.aim(game, fx, fy);
            for (const o of [-0.2, 0, 0.2]) this.shoot(game, a + o, this.bulletSpeed, fx, fy, { color: '#ffef5a' });
          }
        }
        if (st.t > 50) done();
        break;
      case 'flyers':
        if (st.t === 10 && this.minions(game, Flyer) < 3) {
          this.spawnMinion(game, new Flyer(this.cx - 60, this.y + 60, this.diff));
          this.spawnMinion(game, new Flyer(this.cx + 30, this.y + 60, this.diff));
          game.audio.play('alien');
        }
        if (st.t > 30) done();
        break;
      case 'beam':
        if (st.t < 45) this.x += clamp(p.cx - this.cx, -6, 6);
        if (st.t === 45) { this.beamX = this.cx; game.audio.play('warn'); }
        if (st.t === 85) { game.audio.play('beam'); game.shake = 6; }
        if (st.t > 85 && st.t < 150) {
          if (Math.abs(p.cx - this.beamX) < 40) game.hurtPlayer(1, this.beamX);
          if (st.t % 3 === 0) game.particles.push(new Particle(this.beamX + rand(-35, 35), GROUND_Y, rand(-2, 2), rand(-6, -2), 25, '#cfff7a', 5, { glow: true }));
        }
        if (st.t > 160) done();
        break;
    }
  }
  drawBody(ctx, game) {
    const cx = this.cx, cy = this.cy, t = this.t;
    if (this.st && this.st.n === 'beam' && this.st.t >= 45 && this.st.t <= 150) {
      const top = this.y + this.h - 10, bx = this.beamX;
      ctx.save();
      if (this.st.t < 85) {
        ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 2;
        drawLine(ctx, bx - 40, top, bx - 40, GROUND_Y, 'rgba(255,60,60,0.8)', 3);
        drawLine(ctx, bx + 40, top, bx + 40, GROUND_Y, 'rgba(255,60,60,0.8)', 3);
      } else {
        ctx.globalCompositeOperation = 'lighter';
        const wv = 40 + Math.sin(t * 0.8) * 4;
        const g = ctx.createLinearGradient(bx - wv, 0, bx + wv, 0);
        g.addColorStop(0, 'rgba(160,255,90,0)'); g.addColorStop(0.3, 'rgba(160,255,90,0.7)');
        g.addColorStop(0.5, 'rgba(255,255,220,0.95)'); g.addColorStop(0.7, 'rgba(160,255,90,0.7)'); g.addColorStop(1, 'rgba(160,255,90,0)');
        ctx.fillStyle = g; ctx.fillRect(bx - wv, top, wv * 2, GROUND_Y - top);
      }
      ctx.restore();
      this.beginDraw(ctx);
    }
    drawEllipse(ctx, cx, cy - 14, 64, 40, 'rgba(160,255,200,0.4)', 3.5);
    for (const ax of [-28, 0, 28]) {
      const bob = Math.sin(t * 0.1 + ax) * 2;
      drawEllipse(ctx, cx + ax, cy - 20 + bob, 9, 8, '#7cf07c', 2);
      drawCircle(ctx, cx + ax - 3, cy - 21 + bob, 2, '#111', 0); drawCircle(ctx, cx + ax + 3, cy - 21 + bob, 2, '#111', 0);
    }
    drawEllipse(ctx, cx, cy + 10, 135, 32, '#7d8597', 4);

    for (let i = 0; i < 14; i++) {

      drawCircle(ctx, cx - Math.cos(a) * 118, cy + 12 + Math.sin(a) * 14, 4.5, cols[(i + Math.floor(t / 5)) % 5], 1.5);

/* --- Level 3: Mecha-Zorg - a stomping walker with Big Ben's stolen clock --- */
class MechaBoss extends Boss {
  constructor(game) {
    super(game.level.arenaStart + 740, -300, 124, 176, 150, 'MECHA-ZORG', game);
    this.landed = false;
  }
  behave(game) {
    const p = game.player;
    const minX = this.arenaX + 10, maxX = this.arenaX + W - 10 - this.w;
    if (!this.landed) {
      this.vx = 0; this.physics(game);
      if (this.onGround) { this.landed = true; this.stompFx(game); }
      return;
    }
    if (this.introT > 0) { this.physics(game); return; }
    if (!this.st) {
      this.facing = p.cx < this.cx ? -1 : 1;
      this.vx = Math.abs(p.cx - this.cx) > 160 ? this.facing * (this.phase2 ? 1.6 : 1) : 0;
      this.walking = this.vx !== 0;
      if (--this.atkTimer <= 0) {
        const pats = this.phase2 ? ['stomp', 'charge', 'cannon', 'missiles', 'charge', 'stomp'] : ['cannon', 'stomp', 'missiles', 'cannon', 'stomp'];
        this.st = { n: pats[this.atkIdx++ % pats.length], t: 0 };
        this.vx = 0;
      }
    } else {
      const st = this.st; st.t++;
      const done = (w = 0) => { this.st = null; this.atkTimer = (this.phase2 ? 40 : 70) + w; this.contactDmg = 1; };
      switch (st.n) {
        case 'stomp':
          if (st.t === 1) { this.vy = -14; this.vx = clamp((p.cx - this.cx) / 50, -4, 4); }
          if (st.t > 5 && this.onGround) { this.vx = 0; this.stompFx(game, true); done(10); }
          break;
        case 'cannon': {
          this.facing = p.cx < this.cx ? -1 : 1;
          const n = this.phase2 ? 7 : 5;
          if (st.t % 9 === 0 && st.t <= n * 9) {
            const fx = this.cx + this.facing * 80, fy = this.y + 82;
            this.shoot(game, this.aim(game, fx, fy), this.bulletSpeed * 1.3, fx, fy, { color: '#ff4a4a', r: 7 });
          }
          if (st.t > n * 9 + 15) done();
          break;
        }
        case 'missiles':
          if (st.t % 12 === 0 && st.t <= 60) {
            const fx = this.cx - this.facing * 50, fy = this.y + 20;
            game.enemyShot(fx, fy, (p.cx - fx) / 70 + rand(-1.5, 1.5), rand(-12, -9), { kind: 'missile', r: 7, gravity: 0.3, explode: 50, life: 300 });
          }
          if (st.t > 75) done();
          break;
        case 'charge':
          if (st.t === 1) { this.facing = p.cx < this.cx ? -1 : 1; game.audio.play('warn'); }
          if (st.t < 40) this.vx = 0;
          else {
            this.vx = this.facing * 9; this.contactDmg = 2;
            if (st.t % 4 === 0) game.dust(this.cx, this.y + this.h, 3);
            if (this.x <= minX + 2 || this.x >= maxX - 2) { game.shake = 14; game.audio.play('stomp'); done(30); }
          }
          break;
      }
    }
    this.physics(game);
    this.x = clamp(this.x, minX, maxX);
  }
  stompFx(game, waves) {
    game.shake = 16; game.audio.play('stomp'); game.dust(this.cx, this.y + this.h, 16);
    if (waves) for (const d of [-1, 1]) {
      game.addProjectile(new Projectile(this.cx + d * 60, GROUND_Y - 16, d * (5 + this.diff), 0,
        { owner: 'enemy', kind: 'wave', r: 16, life: 150, noCollide: true, damage: 1 }));
    }
  }
  drawBody(ctx, game) {
    const t = this.t, step = this.walking && !this.st ? Math.sin(t * 0.12) : 0;
    ctx.save(); ctx.translate(this.cx, this.y + this.h); ctx.scale(this.facing, 1);
    for (const [lx, ph] of [[-30, step], [30, -step]]) {
      drawRRect(ctx, lx - 10, -70 - ph * 4, 20, 40, 6, '#57627e', 3.5);
      drawRRect(ctx, lx - 8 + ph * 6, -36, 16, 30, 5, '#6c7a96', 3.5);
      drawRRect(ctx, lx - 20 + ph * 6, -10, 40, 12, 5, '#3e4660', 3.5);
      drawCircle(ctx, lx, -70 - ph * 4, 8, '#9aa6bf', 3);
    }
    drawRRect(ctx, -58, -82, 22, 40, 6, '#4f566a', 3.5);
    for (let i = 0; i < 3; i++) drawCircle(ctx, -47, -74 + i * 12, 4, '#ff4a4a', 2);
    drawRRect(ctx, -50, -140, 100, 70, 16, this.phase2 ? '#7d6a8a' : '#6c7a96', 4);
    drawCircle(ctx, 0, -100, 17, '#f4ecd0', 3);
    ctx.save(); ctx.translate(0, -100);
    drawLine(ctx, 0, 0, Math.cos(t * 0.05) * 11, Math.sin(t * 0.05) * 11, OUTLINE, 2.5);
    drawLine(ctx, 0, 0, Math.cos(t * 0.005) * 7, Math.sin(t * 0.005) * 7, OUTLINE, 3);
    ctx.restore();
    drawCircle(ctx, 0, -100, 2.5, OUTLINE, 0);
    ctx.beginPath(); ctx.arc(0, -138, 34, Math.PI, 0); ctx.closePath(); fillStroke(ctx, 'rgba(160,240,255,0.45)', 3.5);
    drawEllipse(ctx, 4, -150, 14, 12, '#7cf07c', 2.5);
    drawEllipse(ctx, 0, -151, 3.5, 5, '#111', 0, -0.4); drawEllipse(ctx, 10, -151, 3.5, 5, '#111', 0, 0.4);
    drawLine(ctx, -6, -160, 6, -156, OUTLINE, 2.5);
    const aimDy = clamp((game.player.cy - (this.y + 82)) / 200, -0.5, 0.5) * this.facing;
    ctx.save(); ctx.translate(46, -96); ctx.rotate(aimDy * this.facing);
    drawRRect(ctx, -10, -14, 28, 28, 8, '#57627e', 3.5);
    drawRRect(ctx, 14, -9, 36, 18, 5, '#3e4660', 3.5);
    drawRRect(ctx, 46, -11, 8, 22, 3, this.st && this.st.n === 'cannon' ? '#ff4a4a' : '#9aa6bf', 3);
    ctx.restore();
    if (this.st && this.st.n === 'charge' && this.st.t < 40 && this.st.t % 6 < 3) {
      ctx.globalAlpha = 0.4; drawRRect(ctx, -50, -140, 100, 70, 16, '#ff3030', 0); ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (this.phase2 && t % 6 === 0) game.particles.push(new Particle(this.cx + rand(-40, 40), this.y + 40, rand(-0.5, 0.5), -1, 40, '#555', 7, { kind: 'smoke', gravity: -0.02 }));
  }
}

/* ===========================================================
   Level definitions, procedural level builder, and parallax
   cartoon backgrounds for each famous location

function buildLevel(idx) {
  const def = LEVEL_DEFS[idx];
  const rng = mulberry32(def.seed);
  const r = (a, b) => a + rng() * (b - a);
  const ri = (a, b) => Math.floor(r(a, b + 1));
  const G = GROUND_Y;
  const L = {
    def, idx, theme: THEMES[def.theme], platforms: [], enemies: [], items: [], hazards: [],
    totalRupeeCoins: 0,
    get totalCoins() { return this.totalRupeeCoins; },
    set totalCoins(v) { this.totalRupeeCoins = v; }
  };

  const ground = (x, w) => L.platforms.push(new Platform(x, G, w, 140, 'ground'));
  const ledge = (x, y, w) => L.platforms.push(new Platform(x, y, w, 16, 'ledge'));
  const block = (x, w, h) => L.platforms.push(new Platform(x, G - h, w, h, 'block'));
  const coin = (x, y) => { L.items.push(new Item(x, y, 'coin')); L.totalRupeeCoins++; };
  const coinRow = (x, y, n, sp = 34) => { for (let i = 0; i < n; i++) coin(x + i * sp, y); };
  const coinArc = (x1, x2, y, n, h = 90) => { for (let i = 0; i < n; i++) { const t = i / (n - 1); coin(lerp(x1, x2, t), y - Math.sin(t * Math.PI) * h); } };
  const spawn = (type, x, y) => {
    const e = createEnemy(type, x, 0, def.diff);
    e.y = y !== undefined ? y : G - e.h;
    L.enemies.push(e); return e;
  };
  const spawnRandom = (x, groundY = G) => {
    const type = weightedPick(def.enemies, rng);
    if (type === 'flyer') spawn('flyer', x, ri(110, 170));
    else { const e = spawn(type, x); e.y = groundY - e.h; }
  };
  const extraEnemies = (x0, x1) => {
    let n = 1 + (rng() < (def.diff - 0.75) ? 1 : 0);
    for (let i = 0; i < n; i++) spawnRandom(lerp(x0, x1, (i + 0.5) / n));
  };

  // safe start
  ground(0, 820);
  coinRow(330, G - 60, 4);
  let x = 820;
  let lastEnergy = 300, lastHealth = 0, lastUfo = 0;
  const weaponsLeft = def.weapons.slice();

  while (x < def.length) {
    const type = weightedPick(def.chunks, rng);
    const sx = x;
    let spot = null; // ground spot for power-ups
    switch (type) {
      case 'flat': {
        const w = ri(480, 700); ground(x, w);
        coinRow(x + 80, G - 60, ri(3, 5));
        extraEnemies(x + 250, x + w - 60);
        spot = x + w - 80; x += w; break;
      }
      case 'gap': {
        const gw = ri(90, 120) + def.diff * 18;
        coinArc(x - 20, x + gw + 20, G - 70, 5, 80);
        x += gw;
        const w = ri(320, 420); ground(x, w);
        if (rng() < 0.5) spawnRandom(x + w - 100);
        spot = x + 60; x += w; break;
      }
      case 'platforms': {
        const w = 820; ground(x, w);
        ledge(x + 110, G - 115, 170); coinRow(x + 145, G - 145, 3);
        ledge(x + 330, G - 225, 170); coinRow(x + 365, G - 255, 3);
        ledge(x + 560, G - 115, 170); coinRow(x + 595, G - 145, 3);
        spawnRandom(x + 640);
        if (rng() < 0.5) { const e = spawn('grunt', x + 400); e.y = G - 225 - e.h; }
        if (sx - lastEnergy > 900) { L.items.push(new Item(x + 415, G - 255 - 30, 'energy')); lastEnergy = sx; }
        spot = x + 60; x += w; break;
      }
      case 'pillar': {
        const w = 620; ground(x, w);
        const bh = ri(70, 110);
        block(x + 260, 64, bh); coinRow(x + 275, G - bh - 30, 2);
        if (rng() < 0.4) block(x + 324, 64, Math.max(50, bh - 45));
        spawnRandom(x + 500);
        spot = x + 120; x += w; break;
      }
      case 'spikes': {
        const w = 640; ground(x, w);
        const sw = ri(110, 150) + Math.round(def.diff * 10);
        L.hazards.push(new Hazard(x + 220, sw));
        ledge(x + 190, G - 125, sw + 60); coinRow(x + 210, G - 155, Math.floor((sw + 40) / 34));
        spawnRandom(x + 560);
        spot = x + 100; x += w; break;
      }
      case 'moving': {
        const pit = 380;
        L.platforms.push(new Platform(x + 130, G - 30, 120, 18, 'moving', { rangeX: 95, speed: 0.018 + def.diff * 0.004, phase: rng() * TAU }));
        coinArc(x + 60, x + pit - 60, G - 80, 5, 70);
        if (rng() < 0.6) spawn('flyer', x + pit / 2, 130);
        x += pit;
        const w = ri(320, 420); ground(x, w);
        spot = x + 80; x += w; break;
      }
      case 'pitledges': {
        const pit = 360;
        ledge(x + 70, G - 70, 90); ledge(x + 210, G - 110, 90);
        coin(x + 115, G - 100); coin(x + 255, G - 140);
        spawn('flyer', x + 200, 120);
        x += pit;
        const w = ri(320, 420); ground(x, w);
        spot = x + 80; x += w; break;
      }
    }
    // power-ups
    if (spot !== null) {
      if (weaponsLeft.length && sx > weaponsLeft[0][0] * def.length) L.items.push(new Item(spot, G - 40, 'weapon', weaponsLeft.shift()[1]));
      else if (sx - lastEnergy > 1100) { L.items.push(new Item(spot, G - 40, 'energy')); lastEnergy = sx; }
      else if (sx - lastHealth > 2100) { L.items.push(new Item(spot, G - 40, 'health')); lastHealth = sx; }
    }
    if (x - lastUfo > def.ufoEvery && x > 1500) { spawn('ufo', x, ri(70, 100)); lastUfo = x; }
  }

  // pre-arena supplies
  L.items.push(new Item(x - 200, G - 40, 'energy'));
  L.items.push(new Item(x - 130, G - 40, 'health'));

  // boss arena
  L.arenaStart = x;
  ground(x, W + 200);
  ledge(x + 130, G - 125, 150);
  ledge(x + W - 280, G - 125, 150);
  ledge(x + W / 2 - 80, G - 230, 160);
  L.arenaEnd = x + W;
  L.width = x + W;
  L.flag = new Flag(x + W - 90);
  return L;
}

function drawBackground(ctx, themeKey, camX, t) {
  const th = THEMES[themeKey] || THEMES.delhi;
  const g = ctx.createLinearGradient(0, 0, 0, H);

}
