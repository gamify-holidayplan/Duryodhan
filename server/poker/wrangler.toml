# Game server for games/poker-live and online games/head-soccer. Deploy with: npx wrangler deploy (from this folder)
name = "poker-live"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PokerRoom"

[[durable_objects.bindings]]
name = "SOCCER"
class_name = "SoccerRoom"

# SQLite-backed Durable Objects are included in the free Workers plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SoccerRoom"]

# Optional, for LiveKit video instead of peer-to-peer. Add these as secrets in the Cloudflare
# dashboard (Worker > Settings > Variables and Secrets): LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
# For video between phones on mobile data, add a Cloudflare TURN key as secrets: TURN_KEY_ID, TURN_KEY_API_TOKEN
